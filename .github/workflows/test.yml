name: Synthetic world-memory tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts
      - run: python -m pip install -r renderers/requirements.txt
      - run: npm test
      - run: npm run test:visual
